<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Deep Words</title>
<link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,500;1,400&family=JetBrains+Mono:wght@300;400&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --bg: #0d0d0f;
    --bg2: #111115;
    --bg3: #17171c;
    --bg4: #1e1e25;
    --border: rgba(255,255,255,0.06);
    --border2: rgba(255,255,255,0.12);
    --text: #e8e6e0;
    --text2: #9490a0;
    --text3: #5a5668;
    --accent: #b89ce8;
    --accent2: #8b6fc4;
    --accent3: rgba(184,156,232,0.1);
    --gold: #d4a84b;
    --sidebar: 260px;
  }

  html, body { height: 100%; background: var(--bg); color: var(--text); font-family: 'JetBrains Mono', monospace; overflow: hidden; }

  /* ── SPLASH ── */
  #splash {
    position: fixed; inset: 0; background: #0d0d0f; z-index: 9999;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 28px;
    transition: opacity 0.8s ease, visibility 0.8s ease;
  }
  #splash.hide { opacity: 0; visibility: hidden; pointer-events: none; }

  .splash-logo {
    opacity: 0; transform: translateY(12px);
    animation: rise 0.75s cubic-bezier(.22,1,.36,1) 0.15s forwards;
  }
  .splash-wordmark {
    display: flex; flex-direction: column; align-items: center; gap: 7px;
    opacity: 0; transform: translateY(10px);
    animation: rise 0.75s cubic-bezier(.22,1,.36,1) 0.42s forwards;
  }
  .splash-title { font-family: 'Lora', serif; font-size: 30px; font-weight: 500; color: var(--text); letter-spacing: 0.1em; }
  .splash-sub   { font-size: 10px; color: var(--text3); letter-spacing: 0.2em; text-transform: uppercase; }

  .splash-progress {
    width: 130px; height: 1px; background: rgba(255,255,255,0.08); border-radius: 1px; overflow: hidden;
    opacity: 0; animation: rise 0.4s ease 0.75s forwards;
  }
  .splash-bar { height: 100%; width: 0; background: var(--accent); animation: barFill 1.2s ease 0.85s forwards; }

  @keyframes rise    { to { opacity: 1; transform: translateY(0); } }
  @keyframes barFill { 0%{width:0} 60%{width:72%} 100%{width:100%} }

  /* ── AUTH SCREEN ── */
  #auth-screen {
    position: fixed; inset: 0; background: var(--bg); z-index: 9500;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    opacity: 0; visibility: hidden; transition: opacity 0.8s cubic-bezier(0.4, 0, 0.2, 1);
  }
  #auth-screen.visible { opacity: 1; visibility: visible; }
  
  .auth-card {
    width: 380px; padding: 48px; background: var(--bg2); border: 1px solid var(--border);
    border-radius: 16px; display: flex; flex-direction: column; gap: 32px;
    box-shadow: 0 40px 100px rgba(0,0,0,0.6);
    opacity: 0; transform: translateY(20px); transition: all 0.6s ease;
  }
  #auth-screen.visible .auth-card { opacity: 1; transform: translateY(0); }

  .auth-header { text-align: center; }
  .auth-title { font-family: 'Lora', serif; font-size: 24px; color: var(--text); font-weight: 500; letter-spacing: 0.05em; margin-bottom: 10px; }
  .auth-sub { font-size: 10px; color: var(--text3); letter-spacing: 0.15em; text-transform: uppercase; font-family: 'JetBrains Mono', monospace; }
  
  .auth-toggle { display: flex; background: var(--bg); border: 1px solid var(--border); border-radius: 8px; padding: 4px; }
  .auth-toggle-btn { flex: 1; padding: 10px; border: none; background: transparent; color: var(--text3); font-size: 9px; font-family: 'JetBrains Mono', monospace; cursor: pointer; border-radius: 6px; transition: 0.3s; text-transform: uppercase; letter-spacing: 0.1em; }
  .auth-toggle-btn.active { background: var(--bg4); color: var(--accent); }
  
  .auth-form { display: flex; flex-direction: column; gap: 20px; }
  .auth-btn { 
    width: 100%; padding: 14px; background: var(--accent3); color: var(--accent);
    border: 1px solid rgba(184,156,232,0.2); border-radius: 8px; font-size: 11px; font-family: 'JetBrains Mono', monospace;
    cursor: pointer; transition: all 0.3s; text-transform: uppercase; letter-spacing: 0.1em;
  }
  .auth-btn:hover { background: var(--accent); color: var(--bg); }
  .auth-btn:disabled { opacity: 0.3; cursor: not-allowed; }

  .auth-error { font-size: 10px; color: #e28b6a; text-align: center; min-height: 14px; font-family: 'Lora', serif; font-style: italic; }

  /* ── APP ── */
  .app {
    display: grid; grid-template-columns: var(--sidebar) 1fr; height: 100vh;
    opacity: 0; transition: opacity 0.8s ease; visibility: hidden;
  }
  .app.visible { opacity: 1; visibility: visible; }

  /* ── SIDEBAR ── */
  .sidebar { background: var(--bg2); border-right: 1px solid var(--border); display: flex; flex-direction: column; overflow: hidden; }

  .sidebar-header { padding: 16px 16px 14px; border-bottom: 1px solid var(--border); position: relative; }

  .app-logo { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; user-select: none; }
  .logo-svg-wrap { width: 32px; height: 32px; flex-shrink: 0; }
  .logo-text-block { display: flex; flex-direction: column; line-height: 1.25; }
  .logo-name    { font-family: 'Lora', serif; font-size: 13px; font-weight: 500; color: var(--text); letter-spacing: 0.05em; }
  .logo-tagline { font-size: 8px; color: var(--text3); letter-spacing: 0.14em; text-transform: uppercase; }
  .user-meta { margin-top: 4px; display: flex; align-items: center; justify-content: space-between; gap: 8px; border-top: 1px solid var(--border); padding-top: 6px; }

  .new-btn {
    width: 100%; padding: 8px 12px; background: var(--accent3);
    border: 1px solid rgba(184,156,232,0.2); border-radius: 6px;
    color: var(--accent); font-family: 'JetBrains Mono', monospace; font-size: 11px;
    cursor: pointer; letter-spacing: 0.06em; text-transform: uppercase;
    transition: all 0.15s; display: flex; align-items: center; justify-content: center; gap: 6px;
  }
  .new-btn:hover { background: rgba(184,156,232,0.18); }

  .entries-label { padding: 14px 16px 6px; font-size: 9px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--text3); }

  .entries-list { flex: 1; overflow-y: auto; padding: 4px 8px; }
  .entries-list::-webkit-scrollbar { width: 3px; }
  .entries-list::-webkit-scrollbar-track { background: transparent; }
  .entries-list::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 2px; }

  .entry-item { padding: 10px; border-radius: 6px; cursor: pointer; transition: background 0.12s; margin-bottom: 2px; position: relative; overflow: hidden; }
  .entry-item:hover  { background: var(--bg3); }
  .entry-item.active { background: var(--bg4); }

  .entry-title { font-family: 'Lora', serif; font-size: 12px; color: var(--text); margin-bottom: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .entry-meta  { display: flex; align-items: center; gap: 6px; }
  .entry-date  { font-size: 9px; color: var(--text3); }
  .entry-preview { font-size: 9px; color: var(--text3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 1; font-style: italic; font-family: 'Lora', serif; }

  .entry-delete {
    position: absolute; right: 6px; top: 50%; transform: translateY(-50%);
    width: 20px; height: 20px; background: rgba(224,75,74,0.12);
    border: none; border-radius: 4px; color: #e24b4a; font-size: 10px;
    cursor: pointer; display: none; align-items: center; justify-content: center; transition: background 0.12s;
  }
  .entry-item:hover .entry-delete { display: flex; }

  .logout-btn { background: transparent; border: none; color: var(--text3); cursor: pointer; font-size: 8px; text-decoration: underline; text-underline-offset: 3px; font-family: 'JetBrains Mono', monospace; opacity: 0.6; }
  .logout-btn:hover { color: #e28b6a; opacity: 1; }

  /* ── EDITOR ── */
  .editor-area { display: flex; flex-direction: column; background: var(--bg); overflow: hidden; }
  .editor-topbar { padding: 14px 40px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid var(--border); min-height: 52px; }
  .mood-badge { padding: 3px 8px; border-radius: 20px; font-size: 9px; letter-spacing: 0.06em; border: 1px solid; cursor: pointer; transition: all 0.12s; text-transform: uppercase; background: transparent; font-family: 'JetBrains Mono', monospace; }
  .mood-badge.on { background: rgba(255,255,255,0.05); }

  .save-status { font-size: 9px; color: var(--text3); letter-spacing: 0.06em; display: flex; align-items: center; gap: 5px; }
  .save-dot    { width: 5px; height: 5px; border-radius: 50%; background: var(--text3); }
  .save-status.saved .save-dot { background: #63c47a; }
  .save-status.unsaved .save-dot { background: var(--gold); }

  .topbar-btn { padding: 5px 10px; background: transparent; border: 1px solid var(--border2); border-radius: 5px; color: var(--text2); font-size: 10px; cursor: pointer; transition: all 0.12s; }
  #entry-title-input { width: 100%; background: transparent; border: none; outline: none; font-family: 'Lora', serif; font-size: 26px; color: var(--text); caret-color: var(--accent); }
  #main-textarea { width: 100%; min-height: 100%; background: transparent; border: none; outline: none; font-family: 'Lora', serif; font-size: 16px; line-height: 1.9; color: var(--text2); caret-color: var(--accent); resize: none; }

  /* ── SELECTION SCREEN ── */
  #selection-screen {
    position: fixed; inset: 0; background: var(--bg); z-index: 9000;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 32px;
    opacity: 0; visibility: hidden; transition: opacity 0.8s ease;
  }
  #selection-screen.visible { opacity: 1; visibility: visible; }
  
  .select-card {
    width: 240px; padding: 40px 24px; background: var(--bg2); border: 1px solid var(--border);
    border-radius: 12px; display: flex; flex-direction: column; align-items: center; gap: 16px; cursor: pointer; transition: 0.3s;
  }
  .select-card:hover { border-color: var(--accent); transform: translateY(-4px); }

  /* ── LOADING OVERLAY ── */
  #loading-overlay {
    position: fixed; inset: 0; background: var(--bg); z-index: 11000;
    display: none; align-items: center; justify-content: center; transition: opacity 0.5s ease;
  }
  #loading-overlay.visible { display: flex; }
  .loader-wrap { display: flex; flex-direction: column; align-items: center; gap: 20px; }
  .loader { width: 1px; height: 40px; background: rgba(255,255,255,0.08); position: relative; overflow: hidden; }
  .loader::after { content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: var(--accent); animation: loaderFlow 1.5s infinite ease-in-out; }
  @keyframes loaderFlow { 0% { transform: translateY(-100%); } 100% { transform: translateY(100%); } }
  .loader-text { font-size: 9px; color: var(--text3); text-transform: uppercase; letter-spacing: 0.25em; font-family: 'JetBrains Mono', monospace; }

  .hidden { display: none !important; }
</style>
</head>
<body>

<!-- SPLASH SCREEN -->
<div id="splash">
  <div class="splash-logo">
    <img src="logo.png" alt="Logo" width="100" height="100" style="border-radius: 20px; object-fit: cover;">
  </div>
  <div class="splash-wordmark">
    <span class="splash-title">Deep Words</span>
    <span class="splash-sub">a sanctuary for your thoughts</span>
  </div>
  <div class="splash-progress">
    <div class="splash-bar"></div>
  </div>
</div>

<!-- AUTH SCREEN -->
<div id="auth-screen">
  <div class="auth-card">
    <div class="auth-header">
      <h2 class="auth-title">The Sanctuary</h2>
      <p class="auth-sub" id="auth-sub-text">Enter your thoughts</p>
    </div>
    <div class="auth-toggle">
      <button class="auth-toggle-btn active" id="toggle-login" onclick="toggleAuthMode('login')">Login</button>
      <button class="auth-toggle-btn" id="toggle-signup" onclick="toggleAuthMode('signup')">Sign Up</button>
    </div>
    <div class="auth-form">
      <div class="form-group">
        <label class="form-label" style="font-size: 9px; letter-spacing: 0.12em; color: var(--text3); text-transform: uppercase; display: block; margin-bottom: 8px;">Email</label>
        <input type="email" id="auth-email" class="form-input" placeholder="presence@deepwords.io" style="width: 100%; background: var(--bg); border: 1px solid var(--border); padding: 12px; color: var(--text); outline: none; border-radius: 8px;">
      </div>
      <div class="form-group">
        <label class="form-label" style="font-size: 9px; letter-spacing: 0.12em; color: var(--text3); text-transform: uppercase; display: block; margin-bottom: 8px;">Password</label>
        <input type="password" id="auth-password" class="form-input" placeholder="••••••••" style="width: 100%; background: var(--bg); border: 1px solid var(--border); padding: 12px; color: var(--text); outline: none; border-radius: 8px;">
      </div>
      <div id="auth-error-msg" class="auth-error"></div>
      <button id="auth-submit-btn" class="auth-btn" onclick="handleAuth()">Enter</button>
    </div>
  </div>
</div>

<!-- SELECTION SCREEN -->
<div id="selection-screen">
  <div style="font-family: 'Lora', serif; font-size: 22px; color: var(--text2); font-style: italic;">How would you like to proceed?</div>
  <div style="display: flex; gap: 20px;">
    <div class="select-card" onclick="goToApp()">
      <i style="font-family: 'Lora', serif; font-size: 32px; color: var(--accent); font-style: italic;">"</i>
      <span style="font-size: 11px; text-transform: uppercase; letter-spacing: 0.2em;">Conversation</span>
    </div>
    <div class="select-card" onclick="goToProblems()">
      <i style="font-family: 'Lora', serif; font-size: 32px; color: var(--accent); font-style: italic;">?</i>
      <span style="font-size: 11px; text-transform: uppercase; letter-spacing: 0.2em;">Problems</span>
    </div>
  </div>
</div>

<!-- MAIN APP -->
<div class="app" id="app">
  <aside class="sidebar">
    <div class="sidebar-header">
      <div class="app-logo">
        <img src="logo.png" width="32" height="32" style="border-radius: 8px;">
        <div class="logo-text-block">
          <span class="logo-name">Deep Words</span>
          <span class="logo-tagline">Sanctuary</span>
        </div>
      </div>
      <div class="user-meta" id="user-meta-container">
        <!-- Injected -->
      </div>
      <button class="new-btn" style="margin-top: 10px;" onclick="newEntry()">+ new entry</button>
    </div>
    <div class="entries-label">Your thoughts</div>
    <div class="entries-list" id="entries-list"></div>
  </aside>

  <main class="editor-area">
    <div class="welcome-screen" id="welcome-screen">
      <div style="font-family: 'Lora', serif; font-size: 20px; color: var(--text2); margin-top: 200px; text-align: center;">Begin your writing stay.</div>
      <button class="new-btn" style="width: auto; padding: 10px 40px; margin-top: 20px; align-self: center;" onclick="newEntry()">begin</button>
    </div>
    <div id="editor-view" class="hidden" style="display:flex; flex-direction:column; height:100%;">
      <div class="editor-topbar">
        <div style="display: flex; gap: 8px;" id="mood-badges">
          <button class="mood-badge" onclick="toggleMood('reflect',this)">reflect</button>
          <button class="mood-badge" onclick="toggleMood('vent',this)">vent</button>
        </div>
        <div class="save-status saved" id="save-status"><div class="save-dot"></div><span id="save-text">saved</span></div>
        <button class="topbar-btn" onclick="deleteCurrentEntry()">delete</button>
      </div>
      <div style="padding: 32px 60px 0;"><input type="text" id="entry-title-input" placeholder="Title..."></div>
      <div style="flex:1; padding: 24px 60px;"><textarea id="main-textarea" oninput="onType()"></textarea></div>
    </div>
  </main>
</div>

<!-- LOADING OVERLAY -->
<div id="loading-overlay">
  <div class="loader-wrap">
    <div class="loader"></div>
    <div class="loader-text">Finding your way...</div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
  /* ── AUDIT LOGGING ── */
  const LOG = (tag, data = '') => console.log(`[DW-INIT] [${new Date().toISOString().slice(11, 23)}] ${tag}`, data);

  const SB_URL = 'https://egohjavpceluzozfambr.supabase.co';
  const SB_KEY = 'sb_publishable_m61Rd7TFryL9oZZ967qiGQ_wgyZpNBN';
  
  let supabase;
  try {
    LOG('Supabase Client Init');
    supabase = window.supabase.createClient(SB_URL, SB_KEY);
  } catch (e) {
    LOG('Supabase Init Error', e);
  }

  const STORAGE_KEY = 'deepwords_entries_v1';
  const PROBLEMS_KEY = 'deepwords_problems_v1';
  const MIGRATION_DONE_KEY = 'deepwords_migrated_v1';

  let entries = [], problems = [], currentId = null, saveTimer = null, currentMood = null, currentUser = null;
  let authMode = 'login';
  let initTimeout;

  /* ── INIT FLOW ── */
  window.addEventListener('load', () => {
    LOG('Window Load Triggered');
    
    // Safety Fallback: 5 Seconds
    initTimeout = setTimeout(() => {
      LOG('CRITICAL: Startup timeout reached. Attempting forced UI recovery.');
      recoverFromFreeze('Initialization timed out. Please check your connection.');
    }, 5000);

    setTimeout(async () => {
      LOG('Phase 1: Session Check Start');
      await checkInitialSession();
    }, 1200);
  });

  async function checkInitialSession() {
    try {
      const { data, error } = await supabase.auth.getSession();
      
      if (error) {
        LOG('Session Check Error', error);
        throw error;
      }

      const session = data?.session;
      LOG('Session Status', session ? 'Authenticated' : 'Unauthenticated');

      const hideSplash = () => {
        LOG('Hiding Splash');
        const splash = document.getElementById('splash');
        splash.classList.add('hide');
        setTimeout(() => splash.style.display = 'none', 800);
      };

      if (session) {
        LOG('Auth Success Path');
        await onAuthSuccess(session.user, true);
        hideSplash();
      } else {
        LOG('No Session Path');
        hideSplash();
        document.getElementById('auth-screen').classList.add('visible');
        clearTimeout(initTimeout); // Successfully reached Auth
      }

      // State Change Listener
      LOG('Setting up Auth Listener');
      supabase.auth.onAuthStateChange(async (event, session) => {
        LOG('Auth State Changed', event);
        if (event === 'SIGNED_IN' && session) {
          await onAuthSuccess(session.user);
        } else if (event === 'SIGNED_OUT') {
          onLogoutSuccess();
        }
      });
    } catch (e) {
      LOG('checkInitialSession Loop Catch', e);
      recoverFromFreeze(e.message);
    }
  }

  async function onAuthSuccess(user, isInitial = false) {
    if (currentUser && currentUser.id === user.id) {
       LOG('Duplicate Auth success ignored');
       return;
    }
    LOG('Handling Auth Success', user.email);
    currentUser = user;
    
    document.getElementById('auth-screen').classList.remove('visible');
    
    // User Meta UI Update
    const container = document.getElementById('user-meta-container');
    if (container) {
      container.innerHTML = `
        <span class="user-email-text">${user.email}</span>
        <button class="logout-btn" onclick="supabase.auth.signOut()">logout</button>
      `;
    }

    if (!isInitial) showLoading(true);
    
    try {
      LOG('Starting Data Migration Check');
      await performMigration();
      LOG('Starting Data Fetch');
      await fetchData();
    } catch (err) {
      LOG('Auth Success Task Error (Non-Fatal)', err);
    } finally {
      clearTimeout(initTimeout);
      LOG('UI Initialization Complete');
      showLoading(false);
      document.getElementById('selection-screen').classList.add('visible');
      renderSidebar();
    }
  }

  async function performMigration() {
    if (localStorage.getItem(MIGRATION_DONE_KEY)) {
      LOG('Migration already performed');
      return;
    }
    
    const e = JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');
    const p = JSON.parse(localStorage.getItem(PROBLEMS_KEY) || '[]');
    
    if (e.length === 0 && p.length === 0) {
      LOG('No local data to migrate');
      localStorage.setItem(MIGRATION_DONE_KEY, 'true');
      return;
    }

    LOG(`Migrating ${e.length} entries and ${p.length} problems...`);
    try {
      if (e.length > 0) {
        const { error } = await supabase.from('entries').insert(e.map(item => ({
          user_id: currentUser.id,
          title: item.title,
          body: item.body,
          created_at: new Date(item.createdAt || Date.now()).toISOString(),
          updated_at: new Date(item.createdAt || Date.now()).toISOString()
        })));
        if (error) throw error;
      }
      localStorage.setItem(MIGRATION_DONE_KEY, 'true');
      LOG('Migration successful');
    } catch (err) {
      LOG('Migration failed', err);
      throw err;
    }
  }

  async function fetchData() {
    LOG('Fetching Data from Cloud...');
    try {
      const { data, error } = await supabase.from('entries').select('*').order('updated_at', { ascending: false });
      if (error) throw error;
      entries = data ? data.map(item => ({ id: item.id, title: item.title, body: item.body, updatedAt: new Date(item.updated_at).getTime() })) : [];
      LOG(`Data Loaded: ${entries.length} entries`);
    } catch (err) {
      LOG('fetchData Catch', err);
      throw err;
    }
  }

  function recoverFromFreeze(msg) {
    LOG('Recovery Mode Triggered:', msg);
    clearTimeout(initTimeout);
    const splash = document.getElementById('splash');
    if (splash) {
      splash.classList.add('hide');
      setTimeout(() => splash.style.display = 'none', 800);
    }
    showLoading(false);
    document.getElementById('auth-screen').classList.add('visible');
    const errEl = document.getElementById('auth-error-msg');
    if (errEl) errEl.textContent = `Presence Sync Error: ${msg}. Attempting recovery...`;
  }

  function onLogoutSuccess() {
    LOG('Handling Logout');
    currentUser = null;
    entries = [];
    document.querySelectorAll('.app, #selection-screen, #problems-page').forEach(el => el.classList.remove('visible'));
    document.getElementById('auth-screen').classList.add('visible');
    renderSidebar();
  }

  /* ── UI FUNCS ── */
  function showLoading(show) { 
    const el = document.getElementById('loading-overlay');
    if (show) el.style.display = 'flex';
    el.classList.toggle('visible', show); 
  }

  function toggleAuthMode(mode) {
    authMode = mode;
    const isLogin = mode === 'login';
    document.getElementById('auth-sub-text').textContent = isLogin ? 'Enter your thoughts' : 'Begin the journey';
    document.getElementById('auth-submit-btn').textContent = isLogin ? 'Enter' : 'Create';
    document.getElementById('toggle-login').classList.toggle('active', isLogin);
    document.getElementById('toggle-signup').classList.toggle('active', !isLogin);
  }

  async function handleAuth() {
    const email = document.getElementById('auth-email').value.trim();
    const password = document.getElementById('auth-password').value;
    const btn = document.getElementById('auth-submit-btn');
    if (!email || !password) return;
    btn.disabled = true;
    showLoading(true);
    try {
      const { error } = authMode === 'login' 
        ? await supabase.auth.signInWithPassword({ email, password })
        : await supabase.auth.signUp({ email, password });
      if (error) throw error;
    } catch (err) {
      document.getElementById('auth-error-msg').textContent = err.message;
    } finally {
      btn.disabled = false;
      showLoading(false);
    }
  }

  function goToApp() {
    document.getElementById('selection-screen').classList.remove('visible');
    document.getElementById('app').classList.add('visible');
    renderSidebar();
  }

  function renderSidebar() {
    const list = document.getElementById('entries-list');
    if (!list) return;
    list.innerHTML = entries.map(e => `
      <div class="entry-item ${e.id===currentId?'active':''}" onclick="openEntry('${e.id}')">
        <div class="entry-title">${e.title || 'Untitled'}</div>
        <div class="entry-date">${new Date(e.updatedAt).toLocaleDateString()}</div>
      </div>
    `).join('');
  }

  function openEntry(id) {
    const entry = entries.find(e=>e.id===id);
    if (!entry) return;
    currentId = id;
    document.getElementById('welcome-screen').classList.add('hidden');
    document.getElementById('editor-view').classList.remove('hidden');
    document.getElementById('entry-title-input').value = entry.title||'';
    document.getElementById('main-textarea').value = entry.body||'';
    renderSidebar();
  }
</script>
</body>
</html>
